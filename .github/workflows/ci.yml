# Checks from ADR 0002: typecheck, lint, tests (twice), build and a smoke test.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          # pnpm isn't on PATH yet; caching would need it.
          package-manager-cache: false

      # pnpm comes from the packageManager field, checked against its hash.
      - run: corepack enable pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - name: Test (runner time zone and locale)
        run: pnpm test

      # LC_ALL overrides LANG, so set both. Fail if Node doesn't pick them up.
      - name: Test (TZ=Pacific/Chatham, tr_TR.UTF-8)
        env:
          TZ: Pacific/Chatham
          LANG: tr_TR.UTF-8
          LC_ALL: tr_TR.UTF-8
        run: |
          node -e '
            const o = Intl.DateTimeFormat().resolvedOptions();
            console.log(o.timeZone, o.locale);
            if (o.timeZone !== "Pacific/Chatham" || o.locale !== "tr-TR") process.exit(1);
          '
          pnpm test

      - run: pnpm build

      - name: Smoke test the built CLI
        run: node dist/cli/main.js --version
